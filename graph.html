<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Map · Biology Second Brain</title>
<link rel="stylesheet" href="../assets/style.css" />
<style>
  .map-layout { display: grid; grid-template-columns: minmax(0,1fr) 340px; gap: 18px; align-items: start; }
  @media (max-width: 980px) { .map-layout { grid-template-columns: 1fr; } }
  #map-canvas { position: relative; }
  .disease-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; position: relative; z-index: 1; }
  @media (max-width: 880px) { .disease-grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 640px) { .disease-grid { grid-template-columns: 1fr; } }
  #link-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 0; pointer-events: none; overflow: visible; }
  #link-overlay line { stroke: var(--accent-disease); stroke-width: 1.6; stroke-opacity: .45; pointer-events: stroke; cursor: pointer; }
  #link-overlay line:hover { stroke-opacity: .9; stroke-width: 2.2; }
  .disease-card { background: var(--surface); border: 1px solid var(--border-soft); border-radius: 20px; padding: 20px; display: flex; flex-direction: column; gap: 10px; cursor: pointer; transition: border-color .15s ease, transform .15s ease, background .15s ease; }
  .disease-card:hover, .disease-card.active { border-color: var(--accent-disease); transform: translateY(-2px); background: #fff; }
  .disease-card h3 { margin: 0; font-family: var(--font-display); font-size: 16px; font-weight: 650; }
  .disease-card .desc { margin: 0; color: var(--text-muted); font-size: 13px; line-height: 1.6; min-height: 20px; }
  .disease-card .mini-label { font-family: var(--font-mono); font-size: 10.5px; color: var(--text-faint); text-transform: uppercase; letter-spacing: .04em; margin-top: 4px; }
  .disease-card .tag-row { min-height: 22px; }
  .map-sidebar { background: var(--surface); border: 1px solid var(--border-soft); border-radius: 20px; padding: 20px; position: sticky; top: 88px; min-height: 200px; }
  .map-sidebar h4 { margin: 4px 0 6px; font-family: var(--font-display); font-size: 17px; }
  .map-sidebar .id-line { font-family: var(--font-mono); font-size: 12px; color: var(--text-faint); margin-bottom: 12px; }
  .map-sidebar .block { margin-top: 16px; }
  .map-sidebar .block h5 { margin: 0 0 8px; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--text-faint); font-family: var(--font-mono); }
  .conn-row { display: flex; justify-content: space-between; gap: 8px; padding: 8px 0; border-top: 1px solid var(--border-soft); font-size: 13px; }
  .conn-row:first-child { border-top: none; }
  .conn-row .note { color: var(--text-faint); font-size: 12px; display: block; }
  .conn-row a { color: var(--text); font-weight: 600; text-decoration: none; }
  .conn-row a:hover { text-decoration: underline; }
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark"></span><a href="../index.html">Biology Second Brain</a><span class="sub">/ map</span></div>
  <nav class="top-links">
    <a href="../index.html">Home</a>
    <a href="library.html">Library</a>
    <a href="graph.html">Map</a>
    <a href="add.html" data-member-plus>+ Add</a>
    <a href="users.html" data-owner-only>Users</a>
  </nav>
</header>
<ul class="base-track"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></ul>

<main class="add-shell">
  <section class="hero" style="padding-bottom:26px;">
    <div class="hero-eyebrow">Disease Map</div>
    <h1>Map</h1>
    <p>암 종별 주요 유전자·메커니즘과, 사람이 직접 만든 질병 간 연결(선)을 함께 보여줍니다. 카드나 연결선을 클릭하면 오른쪽에 상세 정보가 나옵니다.</p>
  </section>

  <div id="error-message" class="error-card" style="display:none; margin-bottom:20px;"></div>
  <div id="loading-message" class="loading-card">데이터를 불러오는 중입니다...</div>
  <div id="empty-message" class="loading-card" style="display:none;">등록된 Map 데이터가 없습니다. <a href="add.html" data-member-plus>Add 페이지</a>에서 논문을 저장하거나 Map을 직접 추가해보세요.</div>

  <div class="map-layout" id="map-layout" style="display:none;">
    <div id="map-canvas">
      <div id="link-overlay-wrap" style="position:relative;">
        <svg id="link-overlay"></svg>
        <div class="disease-grid" id="disease-grid"></div>
      </div>
    </div>
    <aside class="map-sidebar" id="map-sidebar">
      <div class="section-label" style="margin:0 0 10px;">상세 정보</div>
      <div id="sidebar-content" class="status">카드나 연결선을 클릭하면 여기에 표시됩니다.</div>
    </aside>
  </div>
</main>
<footer>권한은 Supabase RLS로 적용됩니다.</footer>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/supabase-config.js"></script>
<script src="../assets/auth-gate.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/search.js"></script>
<script src="../assets/supabase-db.js"></script>
<script>
const wiki = window.BiologyWiki || { escapeHtml: (v) => String(v ?? "") };
const $ = (id) => document.getElementById(id);
let AUTH = null;
let DISEASES = [];
let LINKS = [];
let ACTIVE_ID = null;

function diseaseById(id) { return DISEASES.find((d) => d.id === id); }

function renderGrid() {
  const grid = $("disease-grid");
  grid.innerHTML = DISEASES.map((d) => {
    const genes = (d.keyGenes || []).slice(0, 6).map((g) => `<span class="tag">${wiki.escapeHtml(g)}</span>`).join(" ");
    return `<div class="disease-card" data-id="${wiki.escapeHtml(d.id)}">
      <h3>${wiki.escapeHtml(d.name || d.id)}</h3>
      <p class="desc">${wiki.escapeHtml(d.description || "설명이 없습니다.")}</p>
      <div class="mini-label">대표 유전자</div>
      <div class="tag-row">${genes || '<span class="status">없음</span>'}</div>
    </div>`;
  }).join("");

  grid.querySelectorAll(".disease-card").forEach((card) => {
    card.addEventListener("click", () => selectDisease(card.dataset.id));
  });
}

function drawLinks() {
  const svg = $("link-overlay");
  const wrap = $("link-overlay-wrap");
  const rect = wrap.getBoundingClientRect();
  svg.setAttribute("width", rect.width);
  svg.setAttribute("height", rect.height);
  svg.innerHTML = "";

  LINKS.forEach((l) => {
    const elA = document.querySelector(`.disease-card[data-id="${cssEscape(l.diseaseAId)}"]`);
    const elB = document.querySelector(`.disease-card[data-id="${cssEscape(l.diseaseBId)}"]`);
    if (!elA || !elB) return;
    const a = elA.getBoundingClientRect(), b = elB.getBoundingClientRect();
    const x1 = a.left - rect.left + a.width / 2, y1 = a.top - rect.top + a.height / 2;
    const x2 = b.left - rect.left + b.width / 2, y2 = b.top - rect.top + b.height / 2;
    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", x1); line.setAttribute("y1", y1);
    line.setAttribute("x2", x2); line.setAttribute("y2", y2);
    line.addEventListener("click", () => showLinkDetail(l));
    const title = document.createElementNS("http://www.w3.org/2000/svg", "title");
    title.textContent = `${diseaseById(l.diseaseAId)?.name || l.diseaseAId} ↔ ${diseaseById(l.diseaseBId)?.name || l.diseaseBId}${l.relationNote ? " — " + l.relationNote : ""}`;
    line.appendChild(title);
    svg.appendChild(line);
  });
}
function cssEscape(v) { return String(v).replace(/(["\\])/g, "\\$1"); }

function connectionsFor(id) {
  return LINKS
    .filter((l) => l.diseaseAId === id || l.diseaseBId === id)
    .map((l) => {
      const otherId = l.diseaseAId === id ? l.diseaseBId : l.diseaseAId;
      return { otherId, other: diseaseById(otherId), note: l.relationNote };
    });
}

function selectDisease(id) {
  ACTIVE_ID = id;
  document.querySelectorAll(".disease-card").forEach((c) => c.classList.toggle("active", c.dataset.id === id));
  const d = diseaseById(id);
  if (!d) return;
  const genes = (d.keyGenes || []).map((g) => `<span class="tag">${wiki.escapeHtml(g)}</span>`).join(" ") || '<span class="status">없음</span>';
  const mechList = (d.keyMechanisms || []).map((m) => `<li>${wiki.escapeHtml(m)}</li>`).join("") || "<li>없음</li>";
  const conns = connectionsFor(id);
  const connHtml = conns.length
    ? conns.map((c) => `<div class="conn-row"><span><a href="#" onclick="selectDisease('${wiki.escapeHtml(c.otherId)}');return false;">${wiki.escapeHtml(c.other?.name || c.otherId)}</a>${c.note ? `<span class="note">${wiki.escapeHtml(c.note)}</span>` : ""}</span></div>`).join("")
    : `<div class="status">등록된 연결이 없습니다.</div>`;

  $("sidebar-content").innerHTML = `
    <h4>${wiki.escapeHtml(d.name || d.id)}</h4>
    <div class="id-line">${wiki.escapeHtml(d.id)}${d.createdAt ? " · " + new Date(d.createdAt).toLocaleDateString() : ""}</div>
    <p class="status" style="line-height:1.6;">${wiki.escapeHtml(d.description || "설명이 없습니다.")}</p>
    <div class="block"><h5>대표 유전자</h5><div class="tag-row">${genes}</div></div>
    <div class="block"><h5>주요 메커니즘</h5><ul class="validation-list">${mechList}</ul></div>
    <div class="block"><h5>연결된 질병</h5>${connHtml}</div>
    ${AUTH.canAddPaper ? `<div class="action-row"><a class="btn secondary" href="add.html">Map에서 수정하기</a></div>` : ""}
  `;
}
function showLinkDetail(l) { selectDisease(l.diseaseAId); }

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(drawLinks, 120);
});

(async function init() {
  AUTH = await window.AuthGate.requireAuth({ basePath: "../" });
  if (!AUTH) return;

  try {
    const hub = await window.BioDB.fetchHubData();
    DISEASES = (hub.diseases || []).map((d) => ({ ...d, keyGenes: d.keyGenes || [], keyMechanisms: d.keyMechanisms || [] }));
    LINKS = hub.links || [];

    $("loading-message").style.display = "none";
    if (!DISEASES.length) { $("empty-message").style.display = "block"; return; }

    $("map-layout").style.display = "grid";
    renderGrid();
    requestAnimationFrame(drawLinks);
    selectDisease(DISEASES[0].id);
  } catch (err) {
    console.error(err);
    $("loading-message").style.display = "none";
    $("error-message").style.display = "block";
    $("error-message").textContent = "Map 데이터를 불러오지 못했습니다: " + (err.message || err);
  }
})();
</script>
</body>
</html>
