<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Add New Entry — Biology Second Brain</title>
  <link rel="stylesheet" href="../assets/style.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/supabase-config.js"></script>
  <script src="../assets/data.js"></script>
  <script src="../assets/supabase-db.js"></script>
  <script src="../assets/auth-gate.js"></script>
</head>
<body>
  <header class="top-nav">
    <div class="nav-container">
      <a href="../index.html" class="logo">Biology Second Brain</a>
      <nav class="nav-links">
        <a href="browse.html">Browse</a>
        <a href="library.html">Library</a>
        <a href="graph.html">Map</a>
        <a href="add.html" class="active">Add New</a>
        <a href="users.html" id="nav-users" style="display:none;">Users</a>
      </nav>
      <div class="user-menu" id="user-menu"></div>
    </div>
  </header>

  <main class="container">
    <section class="page-header">
      <h1>Add New Entry</h1>
      <p>GPT가 생성한 큐레이션 JSON을 붙여넣거나 직접 작성하여 DB 및 Map에 저장합니다.</p>
    </section>

    <div id="status-message" class="error-banner" style="display: none; margin-bottom: 20px;"></div>

    <div class="card">
      <h2>1. GPT JSON 붙여넣기</h2>
      <p class="text-muted" style="font-size:0.9rem; margin-bottom:12px;">
        논문 정보와 함께 <code>disease</code>, <code>genes</code>, <code>pathway</code>(메커니즘) 항목이 포함된 JSON을 넣으면 Map(diseases) 데이터도 자동으로 동기화됩니다.
      </p>
      <textarea id="json-input" rows="12" style="width:100%; font-family:monospace; padding:10px;" placeholder='{
  "title": "Example Paper Title",
  "journal": "Nature Cancer",
  "year": 2024,
  "disease": ["Lung Cancer"],
  "genes": ["EGFR", "KRAS"],
  "pathway": ["EGFR TKI Resistance Mechanism"],
  "summary": ["Summary point 1"]
}'></textarea>
      <button id="btn-parse-json" class="btn btn-primary" style="margin-top: 10px;">JSON 저장 및 Map 자동 동기화</button>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const jsonInput = document.getElementById("json-input");
      const parseBtn = document.getElementById("btn-parse-json");
      const statusEl = document.getElementById("status-message");

      function showStatus(msg, isError = false) {
        statusEl.textContent = msg;
        statusEl.style.display = "block";
        statusEl.style.backgroundColor = isError ? "#ffeeee" : "#eef9ee";
        statusEl.style.color = isError ? "#cc0000" : "#008800";
        statusEl.style.border = `1px solid ${isError ? "#ffcccc" : "#ccffcc"}`;
      }

      // 문자열 슬러그화 (예: "Lung Cancer" -> "lung_cancer")
      function slugify(text) {
        return String(text || "")
          .toLowerCase()
          .trim()
          .replace(/[^\w\s-]/g, "")
          .replace(/[\s_-]+/g, "_")
          .replace(/^-+|-+$/g, "");
      }

      parseBtn.addEventListener("click", async () => {
        const rawJson = jsonInput.value.trim();
        if (!rawJson) {
          showStatus("JSON 코드를 입력해 주세요.", true);
          return;
        }

        try {
          const data = JSON.parse(rawJson);
          const auth = window.BiologyAuth?.getAuthData ? window.BiologyAuth.getAuthData() : null;

          if (!auth || !auth.user) {
            throw new Error("로그인이 필요합니다.");
          }

          // 1. Paper 데이터 저장
          const savedPaper = await window.BioDB.savePaper(data, auth);

          // 2. Map(diseases 테이블) 자동 생성/업데이트 로직
          const diseasesList = Array.isArray(data.disease) 
            ? data.disease 
            : (data.disease ? [data.disease] : []);

          const genesList = Array.isArray(data.genes) ? data.genes : [];
          const mechanismsList = Array.isArray(data.pathway) ? data.pathway : (Array.isArray(data.summary) ? data.summary : []);

          let diseaseSavedCount = 0;

          for (const diseaseName of diseasesList) {
            const diseaseId = slugify(diseaseName);
            if (!diseaseId) continue;

            // Map용 Disease 데이터 객체 생성
            const diseaseItem = {
              id: diseaseId,
              name: diseaseName,
              description: `${diseaseName} 관련 논문 데이터 기반 자동 등록`,
              keyGenes: genesList,
              keyMechanisms: mechanismsList
            };

            try {
              // 기존에 없으면 생성, 있으면 저장
              await window.BioDB.saveDisease(diseaseItem, auth, false);
            } catch (e) {
              // 이미 존재하는 경우 update 모드로 재시도
              await window.BioDB.saveDisease(diseaseItem, auth, true);
            }
            diseaseSavedCount++;
          }

          showStatus(`성공적으로 저장되었습니다! (논문 1건 저장, Map용 암 데이터 ${diseaseSavedCount}건 동기화 완료)`);
          jsonInput.value = "";

          setTimeout(() => {
            window.location.href = "graph.html";
          }, 1500);

        } catch (err) {
          console.error("Save Error:", err);
          showStatus(`저장 중 오류가 발생했습니다: ${err.message || err}`, true);
        }
      });
    });
  </script>
</body>
</html>
