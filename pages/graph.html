<!doctype html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Map · Biology Second Brain</title>
<link rel="stylesheet" href="../assets/style.css" />
<link rel="stylesheet" href="../assets/graph-view.css" />
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="mark"></span><a href="../index.html">Biology Second Brain</a><span class="sub">/ map</span></div>
  <nav class="top-links">
    <a href="../index.html">Home</a>
    <a href="library.html">Library</a>
    <a href="graph.html">Map</a>
    <a href="add.html" data-member-plus>+ Add</a>
    <a href="users.html" data-owner-only>Users</a>
  </nav>
</header>
<ul class="base-track"><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span><span></span></ul>

<main class="shell">
  <section class="hero" style="padding-bottom:20px;">
    <div class="hero-eyebrow">Disease Map</div>
    <h1>Map</h1>
    <p>암 종별 주요 유전자, 메커니즘 및 커스텀 연결 관계를 시각적으로 확인합니다. 카드를 클릭하면 상세 정보가 열립니다.</p>
  </section>

  <div id="error-message" class="error-card" style="display:none; margin-bottom:18px;"></div>

  <div class="map-wrap" id="map-wrap">
    <svg id="link-overlay"></svg>
    <div id="map-loading" class="loading-card">Supabase에서 불러오는 중...</div>
    <div class="disease-grid" id="disease-grid" style="display:none;"></div>
    <div id="map-empty" style="display:none;">
      등록된 Disease가 없습니다.<br />
      <a href="add.html" data-member-plus>Add 페이지</a>에서 Paper를 저장하거나 Map에 직접 추가해 보세요.
    </div>
  </div>
</main>
<footer>권한은 Supabase RLS로 적용됩니다.</footer>

<div id="map-detail">
  <button class="close-btn" id="detail-close">닫기 ✕</button>
  <div id="detail-body"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../assets/supabase-config.js"></script>
<script src="../assets/auth-gate.js"></script>
<script src="../assets/data.js"></script>
<script src="../assets/supabase-db.js"></script>
<script>
const $ = (id) => document.getElementById(id);
const esc = (v) => window.AuthGate.escapeHtml(v);
let AUTH = null;
let DISEASES = [];
let LINKS = [];
let PAPERS = [];
let ACTIVE_ID = null;

function norm(v) { return String(v || "").trim().toLowerCase(); }

function linksFor(diseaseId) {
  return LINKS.filter((l) => l.diseaseAId === diseaseId || l.diseaseBId === diseaseId);
}
function otherId(link, diseaseId) {
  return link.diseaseAId === diseaseId ? link.diseaseBId : link.diseaseAId;
}
function diseaseById(id) { return DISEASES.find((d) => d.id === id); }
function papersFor(diseaseName) {
  const target = norm(diseaseName);
  return PAPERS.filter((p) => (p.disease || []).some((d) => norm(d) === target));
}

/* ---------- Render grid ---------- */
function renderGrid() {
  const grid = $("disease-grid");
  if (!DISEASES.length) {
    $("map-empty").style.display = "block";
    grid.style.display = "none";
    return;
  }
  $("map-empty").style.display = "none";
  grid.style.display = "grid";

  grid.innerHTML = DISEASES.map((d) => {
    const geneTags = (d.keyGenes || []).map((g) => `<span class="tag gene-tag">${esc(g)}</span>`).join(" ") || `<span class="tag">등록된 유전자 없음</span>`;
    const mechList = (d.keyMechanisms || []).map((m) => `<li>${esc(m)}</li>`).join("") || "<li>등록된 메커니즘 없음</li>";
    const linkCount = linksFor(d.id).length;
    const canDelete = window.AuthGate.canDeleteDisease(AUTH, d);
    return `<div class="disease-card" data-id="${esc(d.id)}" id="card-${esc(d.id)}">
      ${canDelete ? `<button class="card-delete" type="button" data-delete="${esc(d.id)}" title="삭제">✕</button>` : ""}
      <h3>${esc(d.name)}</h3>
      <p class="desc">${esc(d.description || "설명이 없습니다.")}</p>
      <div class="section-title">대표 유전자</div>
      <div class="tags-wrapper">${geneTags}</div>
      <div class="section-title">주요 메커니즘</div>
      <ul class="mech-list">${mechList}</ul>
      ${linkCount ? `<div class="link-count">🔗 연결 ${linkCount}건</div>` : ""}
    </div>`;
  }).join("");

  grid.querySelectorAll(".disease-card").forEach((card) => {
    card.addEventListener("click", (e) => {
      if (e.target.closest("[data-delete]")) return;
      openDetail(card.dataset.id);
    });
  });
  grid.querySelectorAll("[data-delete]").forEach((btn) => {
    btn.addEventListener("click", async (e) => {
      e.stopPropagation();
      const id = btn.dataset.delete;
      const d = diseaseById(id);
      if (!confirm(`"${d?.name || id}"을(를) Map에서 삭제할까요?\n관련된 연결선도 함께 삭제됩니다.`)) return;
      try {
        await window.BioDB.deleteDisease(id);
        await reloadMap();
        closeDetail();
      } catch (err) {
        alert(`삭제 실패: ${err.message || err}`);
      }
    });
  });

  drawLinks();
}

/* ---------- Draw connection lines between related cards ---------- */
function drawLinks() {
  const svg = $("link-overlay");
  const wrap = $("map-wrap");
  const rect = wrap.getBoundingClientRect();
  svg.setAttribute("width", rect.width);
  svg.setAttribute("height", rect.height);
  svg.setAttribute("viewBox", `0 0 ${rect.width} ${rect.height}`);
  svg.innerHTML = "";

  LINKS.forEach((link) => {
    const elA = $(`card-${link.diseaseAId}`);
    const elB = $(`card-${link.diseaseBId}`);
    if (!elA || !elB) return;
    const ra = elA.getBoundingClientRect();
    const rb = elB.getBoundingClientRect();
    const x1 = ra.left - rect.left + ra.width / 2;
    const y1 = ra.top - rect.top + ra.height / 2;
    const x2 = rb.left - rect.left + rb.width / 2;
    const y2 = rb.top - rect.top + rb.height / 2;

    const line = document.createElementNS("http://www.w3.org/2000/svg", "line");
    line.setAttribute("x1", x1);
    line.setAttribute("y1", y1);
    line.setAttribute("x2", x2);
    line.setAttribute("y2", y2);
    line.dataset.a = link.diseaseAId;
    line.dataset.b = link.diseaseBId;
    if (ACTIVE_ID && (link.diseaseAId === ACTIVE_ID || link.diseaseBId === ACTIVE_ID)) line.classList.add("highlight");
    svg.appendChild(line);
  });
}

let resizeTimer = null;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(drawLinks, 120);
});

/* ---------- Detail panel ---------- */
function openDetail(id) {
  const d = diseaseById(id);
  if (!d) return;
  ACTIVE_ID = id;
  document.querySelectorAll(".disease-card").forEach((c) => c.classList.toggle("active", c.dataset.id === id));
  drawLinks();

  const related = linksFor(id).map((l) => {
    const other = diseaseById(otherId(l, id));
    return `<div class="related-link">
      <span>${esc(other?.name || otherId(l, id))}${l.relationNote ? ` — ${esc(l.relationNote)}` : ""}</span>
    </div>`;
  }).join("") || `<span class="empty-hint">아직 연결선이 없습니다.</span>`;

  const related_papers = papersFor(d.name).map((p) => `<a class="related-paper" href="entity.html?type=paper&id=${encodeURIComponent(p.id)}&name=${encodeURIComponent(p.title)}">${esc(p.title)}</a>`).join("") || `<span class="empty-hint">연결된 Paper가 없습니다.</span>`;

  $("detail-body").innerHTML = `
    <span class="type-badge">Disease</span>
    <h2>${esc(d.name)}</h2>
    <p class="map-desc">${esc(d.description || "설명이 없습니다.")}</p>
    <div class="block">
      <h4>대표 유전자</h4>
      <div class="tags-wrapper">${(d.keyGenes || []).map((g) => `<span class="tag gene-tag">${esc(g)}</span>`).join(" ") || `<span class="empty-hint">없음</span>`}</div>
    </div>
    <div class="block">
      <h4>주요 메커니즘</h4>
      <ul class="mech-list">${(d.keyMechanisms || []).map((m) => `<li>${esc(m)}</li>`).join("") || `<li class="empty-hint">없음</li>`}</ul>
    </div>
    <div class="block">
      <h4>연결된 Disease</h4>
      ${related}
    </div>
    <div class="block">
      <h4>관련 Paper</h4>
      ${related_papers}
    </div>
    ${AUTH.canAddDisease ? `<div class="panel-actions"><a class="btn secondary" href="add.html">Map에서 수정 / 연결 추가하기</a></div>` : ""}
  `;
  $("map-detail").classList.add("open");
}
function closeDetail() {
  $("map-detail").classList.remove("open");
  ACTIVE_ID = null;
  document.querySelectorAll(".disease-card").forEach((c) => c.classList.remove("active"));
  drawLinks();
}
$("detail-close").addEventListener("click", closeDetail);

/* ---------- Load + init ---------- */
async function reloadMap() {
  const hub = await window.BioDB.fetchHubData();
  DISEASES = hub.diseases || [];
  LINKS = hub.links || [];
  renderGrid();
}

(async function init() {
  AUTH = await window.AuthGate.requireAuth({ basePath: "../" });
  if (!AUTH) return;

  try {
    const [hub, all] = await Promise.all([window.BioDB.fetchHubData(), window.BioDB.fetchAll()]);
    DISEASES = hub.diseases || [];
    LINKS = hub.links || [];
    PAPERS = all.papers || [];
    $("map-loading").style.display = "none";
    renderGrid();
    setTimeout(drawLinks, 60);
  } catch (err) {
    console.error("Map fetch error:", err);
    $("map-loading").style.display = "none";
    $("error-message").style.display = "block";
    $("error-message").textContent = `Map 데이터를 불러오지 못했습니다: ${err.message || err}`;
  }
})();
</script>
</body>
</html>
