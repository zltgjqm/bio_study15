<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Map & Knowledge Graph — Biology Second Brain</title>
  <link rel="stylesheet" href="../assets/style.css">
  <link rel="stylesheet" href="../assets/graph-view.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="../assets/supabase-config.js"></script>
  <script src="../assets/data.js"></script>
  <script src="../assets/supabase-db.js"></script>
  <script src="../assets/auth-gate.js"></script>
</head>
<body>
  <header class="top-nav">
    <div class="nav-container">
      <a href="../index.html" class="logo">Biology Second Brain</a>
      <nav class="nav-links">
        <a href="browse.html">Browse</a>
        <a href="library.html">Library</a>
        <a href="graph.html" class="active">Map</a>
        <a href="add.html">Add New</a>
        <a href="users.html" id="nav-users" style="display:none;">Users</a>
      </nav>
      <div class="user-menu" id="user-menu"></div>
    </div>
  </header>

  <main class="graph-container">
    <section class="graph-header">
      <h1>Disease Map & Knowledge Network</h1>
      <p>암 종별 주요 유전자, 메커니즘 및 커스텀 연결 관계를 시각적으로 확인합니다.</p>
    </section>

    <div id="error-message" class="error-banner" style="display: none;"></div>

    <div class="graph-layout">
      <div id="graph-canvas" class="graph-canvas">
        <div id="loading-spinner" class="loading-state">데이터를 불러오는 중입니다...</div>
      </div>
      <aside class="graph-sidebar" id="graph-sidebar">
        <h3>상세 정보</h3>
        <div id="sidebar-content">노드를 선택하면 상세 정보가 표시됩니다.</div>
      </aside>
    </div>
  </main>

  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const canvasEl = document.getElementById("graph-canvas");
      const sidebarEl = document.getElementById("sidebar-content");
      const errorEl = document.getElementById("error-message");
      const spinnerEl = document.getElementById("loading-spinner");

      try {
        if (!window.BioDB || typeof window.BioDB.fetchHubData !== "function") {
          throw new Error("BioDB 모듈을 로드할 수 없습니다.");
        }

        // Supabase에서 암 8종 및 연결 링크 가져오기
        const hubData = await window.BioDB.fetchHubData();
        if (spinnerEl) spinnerEl.style.display = "none";

        // null/undefined 안전 처리
        const rawDiseases = hubData?.diseases || [];
        const rawLinks = hubData?.links || [];

        if (rawDiseases.length === 0) {
          canvasEl.innerHTML = `<div class="empty-state">등록된 암(Disease) 데이터가 없습니다.</div>`;
          return;
        }

        // elements 및 keyGenes null 방지 매핑
        const diseases = rawDiseases.map(d => {
          const safeGenes = Array.isArray(d?.keyGenes) 
            ? d.keyGenes 
            : (Array.isArray(d?.key_genes) ? d.key_genes : []);
          
          const safeMechanisms = Array.isArray(d?.keyMechanisms) 
            ? d.keyMechanisms 
            : (Array.isArray(d?.key_mechanisms) ? d.key_mechanisms : []);

          return {
            ...d,
            keyGenes: safeGenes,
            keyMechanisms: safeMechanisms,
            elements: safeGenes // elements 안전 설정
          };
        });

        // Map 뷰 HTML 렌더링
        renderMapGraph(canvasEl, sidebarEl, diseases, rawLinks);

      } catch (err) {
        console.error("Map Data Fetch Error:", err);
        if (spinnerEl) spinnerEl.style.display = "none";
        if (errorEl) {
          errorEl.textContent = `Supabase 데이터를 불러오지 못했습니다: ${err.message || err}`;
          errorEl.style.display = "block";
        }
      }
    });

    function renderMapGraph(container, sidebar, diseases, links) {
      container.innerHTML = "";
      
      const grid = document.createElement("div");
      grid.className = "disease-grid";

      diseases.forEach(d => {
        const card = document.createElement("div");
        card.className = "disease-card";
        
        // keyGenes/elements 안전 조치
        const geneList = (d.elements || []).map(g => `<span class="tag gene-tag">${g}</span>`).join(" ") || "<span class='text-muted'>없음</span>";
        const mechList = (d.keyMechanisms || []).map(m => `<li>${m}</li>`).join("") || "<li>없음</li>";

        card.innerHTML = `
          <h3>${d.name || d.id}</h3>
          <p class="desc">${d.description || "설명이 없습니다."}</p>
          <div class="section-title">대표 유전자</div>
          <div class="tags-wrapper">${geneList}</div>
          <div class="section-title">주요 메커니즘</div>
          <ul class="mech-list">${mechList}</ul>
        `;

        card.addEventListener("click", () => {
          sidebar.innerHTML = `
            <h4>${d.name}</h4>
            <p><strong>ID:</strong> ${d.id}</p>
            <p><strong>설명:</strong> ${d.description || '-'}</p>
            <p><strong>관련 유전자:</strong> ${(d.elements || []).join(", ") || '-'}</p>
            <p><strong>생성일:</strong> ${d.createdAt ? new Date(d.createdAt).toLocaleDateString() : '-'}</p>
          `;
        });

        grid.appendChild(card);
      });

      container.appendChild(grid);
    }
  </script>
</body>
</html>
